services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your HTTPS address}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      private:
        ipv4_address: 172.30.241.2

  freestuffcrazy-player:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your HTTPS address}
      TRUST_PROXY: 172.30.241.2
    volumes:
      - freestuffcrazy-player-data:/app/data
      - ./config.json:/app/config.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      private:
        ipv4_address: 172.30.241.3

networks:
  private:
    ipam:
      config:
        - subnet: 172.30.241.0/24

volumes:
  caddy-data:
  caddy-config:
  freestuffcrazy-player-data:
