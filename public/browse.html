    async function fetchJson(url, { signal } = {}) {
      const res = await fetch(url, { signal });
      if (!res.ok) {
        // The server may explain the failure for the viewer (with a code).
        const data = await res.json().catch(() => null);
        const explained = typeof data?.error === 'string' && typeof data?.code === 'string';
        throw Object.assign(new Error(explained ? data.error : `${url}: ${res.status}`), { status: res.status, code: explained ? data.code : null });
      }
      return res.json();
    }

    // A failure the viewer can act on: the server's own explanation, and the
    // next step (sign in again when the session ended, otherwise retry).
    function showLoadError(err) {
      if (!err?.code) { showMessage(`Error: ${err.message}`); return; }
      const message = document.createElement('p');
      message.textContent = err.message;
      const action = document.createElement('button');
      action.type = 'button';
      action.className = 'loadErrorAction';
      if (err.status === 401) {
        action.textContent = 'Sign in again';
        action.addEventListener('click', () => { location.href = '/login'; });
      } else {
        action.textContent = 'Try again';
        action.addEventListener('click', () => location.reload());
      }
      showMessage(''); // not the spinner's layout
      loadingEl.replaceChildren(message, action);
    }

    // Resume a bit before the stored offset so we don't drop the last line of dialogue.
    function setResume(params, item) {
      if (isResumable(item)) params.set('resume', String(Math.max(0, Math.floor(item.viewOffset / 1000) - 3)));
    }

    function playItem(item) {
      const params = new URLSearchParams({ key: item.ratingKey });
      setResume(params, item);
      // Carries the active tab, show and season through so the player's back link
      // can return straight to this screen (see canvas2.html).
      writeBrowseView(params, { tab: currentLibraryId, view: currentView, show: currentShowKey, season: currentSeasonKey });
      window.location.href = `/canvas2?${params}`;
    }

    // ---- Music that keeps playing while you browse ----
    // The player is held in a frame (see music-host.js). Open, it is the whole screen; "Browse" in it only
    // shrinks it to the bar at the bottom of this page, and the music goes on. Moving to movies, shows or a
    // plugin's tab stops it. Where this page cannot hold the player (it is not isolated), a track still plays by
    // going to the player's page, as before.
    const musicHost = (() => {
      const holder = document.getElementById('nowPlaying');
      const bar = document.getElementById('playbar');
      const els = {
        art: document.getElementById('playbarArt'), title: document.getElementById('playbarTitle'), artist: document.getElementById('playbarArtist'),
        fill: document.getElementById('playbarFill'), time: document.getElementById('playbarTime'), play: document.getElementById('playbarPlay'), prev: document.getElementById('playbarPrev'), next: document.getElementById('playbarNext'),
      };
      let frame = null;
      let open = false;
      let state = null;
      const supported = () => window.crossOriginIsolated === true;
      // What is playing, kept on this device so reopening the app (a new tab, after the browser was closed
      // or the page was discarded) comes back to the player with the same list, not only a refresh.
      // The queue itself lives in the tab's session storage, which does not outlast the tab, so a copy is kept too.
      const SESSION_KEY = MUSIC_SESSION_KEY;
      // Who is signed in, as the server names them (one-way, per install). What is kept is kept for them alone:
      // with no answer it is neither saved nor restored.
      const ownerPromise = fetch('/api/auth/me', { cache: 'no-store' })
        .then((res) => (res.ok ? res.json() : null))
        .then((user) => (typeof user?.stateScope === 'string' && user.stateScope ? user.stateScope : null))
        .catch(() => null);
      let owner = null;
      ownerPromise.then((value) => { owner = value; });
      const RESTORE_WITHIN_MS = 24 * 60 * 60 * 1000;
      let lastSaved = '';
      let lastCopied = { id: null, at: 0 };
      // The queue is known from the moment it starts, so a refresh straight after pressing Play is kept too.
      let queueId = null;
      function remember() {
        try {
          const queue = queueId || state?.queue;
          if (!frame || !queue || !owner) return;
          const value = JSON.stringify({ queue, open, position: Math.floor(state?.position || 0), playing: state?.playing === true });
          if (value === lastSaved) return;
          lastSaved = value;
          localStorage.setItem(SESSION_KEY, JSON.stringify({ ...JSON.parse(value), owner, savedAt: Date.now() }));
          // The queue changes only when the track does, so its copy is refreshed every few seconds, not every tick.
          if (lastCopied.id !== queue || Date.now() - lastCopied.at > 5000) {
            const current = readQueue(sessionStorage, queue);
            if (current && saveQueue(localStorage, current)) lastCopied = { id: queue, at: Date.now() };
          }
        } catch { /* a refresh then starts without it */ }
      }
      function forget() {
        lastSaved = ''; lastCopied = { id: null, at: 0 };
        try { localStorage.removeItem(SESSION_KEY); } catch { /* nothing kept */ }
      }
      const command = (name, extra = {}) => frame?.contentWindow?.postMessage({ type: MUSIC_MESSAGE, event: 'command', name, ...extra }, location.origin);

      function render() {
        const showBar = !!frame && !open && !!state;
        bar.hidden = !showBar;
        document.body.classList.toggle('hasPlaybar', showBar);
        if (!showBar) return;
        els.title.textContent = state.title || 'Playing';
        els.artist.textContent = [state.artist, state.album].filter(Boolean).join(' — ');
        if (state.thumbnail) showArt(els.art, state.thumbnail, state.album || state.title);
        els.fill.style.width = state.duration ? `${Math.min(100, (state.position / state.duration) * 100)}%` : '0%';
        els.time.textContent = state.duration ? `${clockOf(state.position)} / ${clockOf(state.duration)}` : '';
        // What the player means to be doing, so a moment of buffering still shows Pause.
        const playing = state.playing;
        els.play.replaceChildren(iconEl(playing ? 'pause' : 'play'));
        els.play.setAttribute('aria-busy', state.state === 'loading' || state.state === 'buffering' ? 'true' : 'false');
        els.play.setAttribute('aria-label', playing ? 'Pause' : 'Play');
        els.prev.disabled = !state.hasPrevious;
        els.next.disabled = !state.hasNext;
      }
      function setOpen(value) {
        open = value;
        holder.classList.toggle('minimized', !value);
        if (value) frame?.focus();
        render();
        remember();
      }
      function stop() {
        if (!frame) return;
        command('stop');
        frame.remove();
        frame = null;
        state = null;
        queueId = null;
        forget();
        setOpen(false);
      }
      // Play this queue's track in the player, opening it full screen.
      function start(params) {
        params.set('embedded', '1');
        if (!frame) {
          frame = document.createElement('iframe');
          frame.title = 'Now playing';
          // The player may start sound by itself once a tap here has asked for it, and needs isolation like this page.
          frame.setAttribute('allow', 'autoplay; cross-origin-isolated');
          holder.append(frame);
        }
        state = null;
        queueId = params.get('queue');
        frame.src = `/canvas2?${params}`;
        setOpen(true);
      }
      window.addEventListener('message', (event) => {
        if (!fromFrame(event, frame?.contentWindow, location.origin)) return;
        if (event.data?.type === MUSIC_MESSAGE && event.data.event === 'minimize') { setOpen(false); return; }
        // An artist or album link in the player: shrink it and go there in this page, so the music goes on.
        if (event.data?.type === MUSIC_MESSAGE && event.data.event === 'navigate') {
          try {
            const target = new URL(String(event.data.url), location.origin);
            if (target.origin !== location.origin || target.pathname !== '/browse') return;
            const { tab, view, show, season } = readBrowseView(target.search);
            const lib = libraries.find((l) => l.id === tab);
            setOpen(false);
            if (lib && show) restoreShowView(lib, show, season, view);
            else if (lib) openLibrary(lib, view);
          } catch { /* not a link we follow */ }
          return;
        }
        const next = cleanState(event.data);
        if (next) {
          if (skipFrom && next.key !== skipFrom.key) skipping(null);
          state = next;
          if (next.skipping && !skipFrom) skipping(next.skipping === 'next' ? els.next : els.prev);
          render(); remember();
        }
      });
      document.getElementById('playbarOpen').addEventListener('click', () => setOpen(true));
      document.getElementById('playbarExpand').addEventListener('click', () => setOpen(true));
      els.play.addEventListener('click', () => command('toggle'));
      // From the tap until the player reports another track (or a few seconds, if nothing came of it).
      let skipFrom = null;
      let skipTimer = null;
      function skipping(button) {
        skipFrom = button ? { key: state?.key ?? null } : null;
        for (const other of [els.prev, els.next]) other.classList.toggle('skipping', other === button);
        clearTimeout(skipTimer);
        if (button) skipTimer = setTimeout(() => skipping(null), 10000);
      }
      els.prev.addEventListener('click', () => { if (skipFrom) return; skipping(els.prev); command('previous'); });
      els.next.addEventListener('click', () => { if (skipFrom) return; skipping(els.next); command('next'); });
      document.getElementById('playbarClose').addEventListener('click', stop);
      // After a refresh or reopening the app: the player comes back where it was, on the same list and on the same screen
      // (full or the bar), playing again if it was, paused if it was paused.
      async function restore() {
        if (frame || !supported()) return;
        try {
          const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
          if (!saved) return;
          const who = await ownerPromise;
          if (frame) return; // something else started music while the answer was awaited
          // Kept by someone else (another account or profile on this browser): not theirs to see or play, and gone now.
          if (!who || saved.owner !== who) { if (who) clearSavedMusic(); return; }
          if (saved && !(Date.now() - saved.savedAt < RESTORE_WITHIN_MS)) { forget(); return; }
          const id = saved && typeof saved.queue === 'string' ? saved.queue : null;
          // This tab's own copy first (a refresh); otherwise the copy kept on the device (the app was reopened).
          let queue = id ? readQueue(sessionStorage, id) : null;
          if (id && !queue) {
            queue = readQueue(localStorage, id);
            if (queue) saveQueue(sessionStorage, queue);
          }
          const track = queue?.items[queue.index];
          // (A video is not music to put back behind the browse screen.)
          if (!track || track.video) { forget(); return; }
          const params = new URLSearchParams({ key: track.ratingKey, queue: queue.id });
          // Music that was playing carries on; if the browser will not start sound by itself, the player offers a tap to unlock it.
          if (saved.playing !== true) params.set('paused', '1');
          if (Number.isFinite(saved.position) && saved.position > 0) params.set('resume', String(saved.position));
          start(params);
          setOpen(saved.open !== false);
        } catch { forget(); }
      }
      return { start, stop, restore, supported, get active() { return !!frame; } };
    })();

    // Press Play: a queue of tracks is made (and kept for the player, a page per track) and the
    // first is played. An artist plays every track shuffled; an album or playlist plays in order,
    // or shuffled; a track plays its album, or whatever list it was in, from that track on.
    // Videos (`video`) play one after another in the player's own page, the first resuming where it was left
    // unless shuffled.
    function playQueue({ label = '', items, start = 0, shuffle = false, radio = null, video = false }) {
      // A very long list is cut around the track chosen rather than from its beginning.
      let list = items;
      let at = start;
      if (!shuffle && list.length > MAX_QUEUE) {
        const from = Math.max(0, start - 50);
        list = list.slice(from, from + MAX_QUEUE);
        at = start - from;
      }
      // Repeat is a setting of the player that outlasts a queue.
      let repeat = 'off';
      try { repeat = localStorage.getItem('freeStuffCrazyPlayer.repeat') || 'off'; } catch { /* off */ }
      const queue = createQueue({ label, items: list, start: at, shuffle, repeat, radio });
      if (!queue.items.length) return;
      let saved = false;
      try { saved = saveQueue(sessionStorage, queue); } catch { /* the player then plays this track alone */ }
      const first = queue.items[queue.index].ratingKey;
      const params = new URLSearchParams({ key: first });
      // A queue of videos, or one (a playlist) that opens on a video, starts as a film does.
      video = video || !!queue.items[queue.index].video;
      const firstItem = video && !shuffle ? list.find((item) => String(item.ratingKey) === first) : null;
      if (firstItem) setResume(params, firstItem);
      // The player takes `queue` to mean music from its first moment, so videos name their queue apart.
      if (saved) params.set(video ? 'videoQueue' : 'queue', queue.id);
      writeBrowseView(params, { tab: currentLibraryId, view: currentView, show: currentShowKey, season: currentSeasonKey });
      if (video) { window.location.href = `/canvas2?${params}`; return; }
      // Held in a frame, the music carries on while you browse; if this page cannot hold it, go to the player.
      if (saved && musicHost.supported()) { musicHost.start(params); return; }
      window.location.href = `/canvas2?${params}`;
    }

    // The list a track was clicked in, as a queue starting at it.
    // Clicking a track plays it and then tracks that sound like it, as Plex's sonic similarity finds them,
    // added to the list after it. A source (or a library) with none to offer, or one that is slow to say,
    // plays the track's own list from it, as before.
    const SIMILAR_WAIT_MS = 2500;
    async function playTrackWithSimilar(track) {
      let similar = [];
      try {
        similar = await Promise.race([
          fetchJson(`/api/library/similar-tracks/${track.ratingKey}`),
          new Promise((resolve) => setTimeout(() => resolve([]), SIMILAR_WAIT_MS)),
        ]);
      } catch { /* the track's own list */ }
      const more = (Array.isArray(similar) ? similar : []).filter((item) => item.type === 'track' && item.ratingKey !== track.ratingKey);
      if (!more.length) { playTrackFromList(track); return; }
      playQueue({ label: `Similar to ${track.title}`, items: [track, ...more], start: 0 });
    }

    function playTrackFromList(track) {
      const tracks = gridState.items.filter((item) => item.type === 'track'); // what is shown, as filtered
      const at = tracks.findIndex((item) => item.ratingKey === track.ratingKey);
      const label = currentQueueLabel || (currentView === 'tracks' ? 'Tracks' : '');
      playQueue({ label, items: at >= 0 ? tracks : [track], start: Math.max(0, at) });
    }

    function openItem(item) {
      if (item.type === 'track') { playTrackWithSimilar(item); return; }
      // Details screen is movies-only. Episodes always play directly (as before),
      // and an in-progress movie skips straight back into resume playback.
      if (item.type !== 'movie' || isResumable(item)) {
        playItem(item);
      } else {
        const params = new URLSearchParams({ key: item.ratingKey });
        writeBrowseView(params, { tab: currentLibraryId, view: currentView, show: currentShowKey, season: currentSeasonKey });
        window.location.href = `/detail?${params}`;
      }
    }

    // Dispatch cards by type; Recently Added may contain both seasons and episodes.
    // An artist holds albums the way a show holds seasons, and an album holds tracks the way a
    // season holds episodes, so music reuses those screens (see sources.js).
    const OPENS_CHILDREN = new Set(['show', 'artist']);
    const OPENS_GROUP = new Set(['season', 'album']);
    const SQUARE_ART = new Set(['artist', 'album', 'track', 'playlist']);
    function handleItemClick(item, { skippedSeasons = false } = {}) {
      if (item.type === 'playlist') {
        openPlaylist(item);
      } else if (OPENS_CHILDREN.has(item.type)) {
        openShowSeasons(item.ratingKey, item.title);
      } else if (OPENS_GROUP.has(item.type)) {
        // An album picked from a list of every album has no artist screen behind it: Back is the list.
        if (item.type === 'album' && onLibraryPage) skippedSeasons = true;
        // Skip the season-list back target when navigation bypassed that list.
        openSeason(item, { skippedSeasons });
      } else {
        openItem(item);
      }
    }

    async function loadRecentlyAdded(libId) {
      const loadId = ++recentLoadId;
      try {
        recentItems = await fetchJson(`/api/library/library/${libId}/recentlyadded`);
      } catch (err) {
        recentItems = [];
      }
      if (loadId !== recentLoadId) return; // library switched again while this was in flight
      renderRecentRow();
    }

    function renderRecentRow() {
      recentRow.innerHTML = '';
      recentRow.scrollLeft = 0;
      for (const item of recentItems) {
        const card = document.createElement('div');
        card.className = 'recentCard ' + item.type;

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'thumbWrap';
        const img = document.createElement('img');
        img.loading = 'lazy'; // before src, or the image starts loading at once
        setArt(thumbWrap, img, item.thumbnail, item.type === 'episode' ? item.showTitle : item.title);
        thumbWrap.appendChild(img);
        card.appendChild(thumbWrap);

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = item.type === 'episode' ? item.showTitle : item.title;
        card.appendChild(title);

        const meta = document.createElement('div');
        meta.className = 'meta';
        if (item.type === 'episode') {
          meta.textContent = `${item.season != null ? 'S' + item.season : ''}${item.episode != null ? 'E' + item.episode : ''} ${item.title}`.trim();
        } else if (item.type === 'season') {
          meta.textContent = `${item.showTitle || ''} — ${item.title}`.replace(/^ — /, '');
        } else {
          meta.textContent = item.year || '';
        }
        card.appendChild(meta);

        card.addEventListener('click', () => handleItemClick(item, { skippedSeasons: true }));
        recentRow.appendChild(card);
      }
      showRecentSection(true);
      recentRow.updateCarouselButtons();
    }

    // Render only rows near the viewport; spacers preserve scroll position.
    const GRID_MIN_COL_WIDTH = 150; // keep in sync with .grid's CSS minmax()
    const GRID_ROW_BUFFER = 2; // extra rows rendered above/below the viewport
    const gridState = { all: [], items: [], episode: false, columns: 0, rowHeight: 0, renderedRange: null };

    const clock = ms => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}`;
    function buildCard(item, episode) {
      const isSeason = OPENS_GROUP.has(item.type);
      const isTrack = item.type === 'track';
      const card = document.createElement('div');
      card.className = 'card' + (episode ? ' episode' : '') + (SQUARE_ART.has(item.type) ? ' square' : '');

      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'thumbWrap';

      const img = document.createElement('img');
      img.loading = 'lazy'; // before src, or the image starts loading at once
      setArt(thumbWrap, img, item.thumbnail, item.title);
      thumbWrap.appendChild(img);

      if (item.durationMs && item.viewOffset > 0) {
        const bar = document.createElement('div');
        bar.className = 'progressBar';
        const fill = document.createElement('div');
        fill.className = 'fill';
        fill.style.width = `${Math.min(100, (item.viewOffset / item.durationMs) * 100)}%`;
        bar.appendChild(fill);
        thumbWrap.appendChild(bar);
      }

      card.appendChild(thumbWrap);

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = isTrack
        ? `${item.episode != null ? item.episode + '. ' : ''}${item.title}`
        : episode
          ? `${item.season != null ? 'S' + item.season : ''}${item.episode != null ? 'E' + item.episode : ''} ${item.title}`.trim()
          : item.title;
      card.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'meta';
      if (isTrack) {
        meta.textContent = [item.artist, item.durationMs ? clock(item.durationMs) : null].filter(Boolean).join(' · ');
      } else if (isSeason) {
        meta.textContent = item.type === 'album'
          ? [item.year, item.leafCount ? `${item.leafCount} tracks` : null].filter(Boolean).join(' · ')
          : item.leafCount
            ? `${item.viewedLeafCount || 0}/${item.leafCount} episodes`
            : '';
      } else if (item.type === 'artist') {
        meta.textContent = item.leafCount ? `${item.leafCount} tracks` : '';
      } else if (item.type === 'playlist') {
        // (A playlist may hold videos as well as tracks.)
        meta.textContent = [item.leafCount ? `${item.leafCount} ${item.leafCount === 1 ? 'item' : 'items'}` : null, item.duration ? `${item.duration}m` : null].filter(Boolean).join(' · ');
      } else if (episode) {
        meta.textContent = item.duration ? `${item.duration}m` : '';
      } else {
        meta.textContent = [item.year, item.duration ? `${item.duration}m` : null].filter(Boolean).join(' · ');
      }
      card.appendChild(meta);

      card.addEventListener('click', () => (typeof item.onPlay === 'function' ? item.onPlay() : handleItemClick(item)));
      return card;
    }

    function measureColumns() {
      const style = getComputedStyle(gridItemsEl);
      const gap = parseFloat(style.columnGap) || 14;
      // The column width the CSS asks for, so the count matches what is drawn. (Counting 150px columns
      // for a list of 300px ones made the list look shorter than it is, and its end could not be reached.)
      const min = parseFloat(style.getPropertyValue('--col-min')) || GRID_MIN_COL_WIDTH;
      return Math.max(1, Math.floor((gridItemsEl.clientWidth + gap) / (min + gap)));
    }

    // Measure a rendered card so virtualized spacers match the current CSS.
    function measureRowHeight(episode, sampleItem) {
      const probe = document.createElement('div');
      probe.style.position = 'absolute';
      probe.style.visibility = 'hidden';
      probe.style.pointerEvents = 'none';
      probe.style.left = '-99999px';
      probe.style.top = '0';
      probe.style.width = `${gridItemsEl.clientWidth}px`;
      probe.className = gridItemsEl.className;
      document.body.appendChild(probe);
      const card = buildCard(sampleItem, episode);
      probe.appendChild(card);
      const rowGap = parseFloat(getComputedStyle(probe).rowGap) || 14;
      const height = card.getBoundingClientRect().height + rowGap;
      document.body.removeChild(probe);
      return height || 300;
    }

    function clearGrid() {
      currentQueueLabel = '';
      similarEl.replaceChildren();
      letterBarEl.hidden = true;
      document.body.classList.remove('hasLetterBar');
      pendingLetter = null;
      popularEl.hidden = true;
      popularListEl.replaceChildren();
      gridState.all = [];
      gridState.items = [];
      libraryActionsEl.hidden = true;
      gridControlsEl.hidden = true;
      viewSwitchEl.hidden = true;
      gridState.columns = 0;
      gridState.rowHeight = 0;
      gridState.renderedRange = null;
      gridItemsEl.innerHTML = '';
      gridTopEl.style.height = '0px';
      gridBottomEl.style.height = '0px';
    }

    // `items` is everything on this screen; what the filter box holds decides which are shown.
    function renderGrid(items, { episode = false, total = items.length } = {}) {
      gridState.all = items;
      gridState.episode = episode;
      gridState.total = total;
      gridItemsEl.classList.toggle('trackList', items.length > 0 && items.every((item) => item.type === 'track'));
      showGridItems();
    }

    function showGridItems() {
      gridState.items = gridState.all;
      gridState.columns = 0;
      gridState.rowHeight = 0;
      gridState.renderedRange = null;
      updateLetterBar();
      gridControlsEl.hidden = viewSwitchEl.hidden && libraryActionsEl.hidden;
      renderVirtualGridWindow();
      runPendingLetter();
    }

    // ---- The # A-Z bar ----
    const letterButtons = new Map();
    let letterPositions = new Map();
    let pendingLetter = null; // a letter tapped before its section had loaded
    for (const letter of LETTERS) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = letter;
      button.setAttribute('aria-label', letter === '#' ? 'Jump to numbers and symbols' : `Jump to ${letter}`);
      // Touch, pen and mouse go through the bar's pointer handlers below; a click with no pointer is the keyboard.
      button.addEventListener('click', (event) => { if (event.detail === 0) tapLetter(letter); });
      letterButtons.set(letter, button);
      letterBarEl.append(button);
    }
    const listIsComplete = () => !(gridState.total > gridState.all.length);

    // Slide a finger down the bar and the list follows it; the letter is shown just left of the finger.
    const letterBubble = document.createElement('div');
    letterBubble.id = 'letterBubble';
    letterBubble.hidden = true;
    letterBubble.setAttribute('aria-hidden', 'true');
    document.body.append(letterBubble);
    let scrubbing = null; // { pointerId, letter }
    function letterAt(event) {
      const rect = letterBarEl.getBoundingClientRect();
      // However far left the finger has strayed, it is the height that says which letter.
      const hit = document.elementFromPoint(rect.left + rect.width / 2, Math.min(Math.max(event.clientY, rect.top + 2), rect.bottom - 2));
      const button = hit?.closest?.('#letterBar button');
      return button ? button.textContent : null;
    }
    function scrubTo(event) {
      const letter = letterAt(event);
      if (!letter) return;
      const rect = letterBarEl.getBoundingClientRect();
      // Left of the finger, and kept on screen.
      const size = 64;
      const left = Math.max(8, Math.min(event.clientX - size - 28, rect.left - size - 8));
      const top = Math.max(8, Math.min(event.clientY - size / 2, window.innerHeight - size - 8));
      letterBubble.style.left = `${left}px`;
      letterBubble.style.top = `${top}px`;
      if (letter === scrubbing.letter) return;
      scrubbing.letter = letter;
      letterBubble.textContent = letter;
      for (const [other, button] of letterButtons) button.classList.toggle('scrubbing', other === letter);
      tapLetter(letter);
    }
    function endScrub(event) {
      if (!scrubbing || (event && event.pointerId !== scrubbing.pointerId)) return;
      scrubbing = null;
      letterBubble.hidden = true;
      for (const button of letterButtons.values()) button.classList.remove('scrubbing');
    }
    letterBarEl.addEventListener('pointerdown', (event) => {
      if (event.button > 0 || scrubbing) return;
      scrubbing = { pointerId: event.pointerId, letter: null };
      try { letterBarEl.setPointerCapture(event.pointerId); } catch { /* the bar still gets the moves it is over */ }
      letterBubble.hidden = false;
      event.preventDefault();
      scrubTo(event);
    });
    letterBarEl.addEventListener('pointermove', (event) => { if (scrubbing && event.pointerId === scrubbing.pointerId) scrubTo(event); });
    letterBarEl.addEventListener('pointerup', endScrub);
    letterBarEl.addEventListener('pointercancel', endScrub);
    letterBarEl.addEventListener('lostpointercapture', endScrub);

    // Shown on a long library list; which letters have a section, and where each begins.
    function updateLetterBar() {
      const lib = libraries.find((l) => l.id === currentLibraryId);
      const show = onLibraryPage && !activePluginTab && lib?.type !== 'playlists' && gridState.items.length >= LETTER_BAR_MIN_ITEMS;
      letterBarEl.hidden = !show;
      document.body.classList.toggle('hasLetterBar', show);
      if (!show) return;
      letterPositions = letterIndex(gridState.items, currentView);
      // While the rest of a long list is still arriving, every letter can be tapped.
      for (const [letter, button] of letterButtons) button.disabled = listIsComplete() && !letterPositions.has(letter);
    }

    function scrollToItem(index) {
      const columns = gridState.columns || measureColumns();
      const row = Math.floor(index / columns);
      const top = gridEl.getBoundingClientRect().top + window.scrollY + row * gridState.rowHeight - 8;
      window.scrollTo({ top: Math.max(0, top), behavior: 'auto' });
      scheduleRenderVirtualGridWindow();
    }

    function tapLetter(letter) {
      if (!listIsComplete() && !letterPositions.has(letter)) {
        // Its section has not come in yet: go on as far as there is, and on to it when it arrives.
        pendingLetter = letter;
        letterButtons.get(letter)?.classList.add('pending');
        scrollToItem(Math.max(0, gridState.items.length - 1));
        return;
      }
      const at = targetIndex(letterPositions, letter);
      if (at !== null) scrollToItem(at);
    }

    function runPendingLetter() {
      if (!pendingLetter || (!letterPositions.has(pendingLetter) && !listIsComplete())) {
        if (pendingLetter) scrollToItem(Math.max(0, gridState.items.length - 1)); // keep up with the loading
        return;
      }
      const letter = pendingLetter;
      pendingLetter = null;
      letterButtons.get(letter)?.classList.remove('pending');
      tapLetter(letter);
    }

    function renderVirtualGridWindow() {
      if (gridEl.style.display === 'none' || !gridState.items.length) {
        if (gridItemsEl.children.length || gridState.renderedRange) {
          gridItemsEl.innerHTML = '';
          gridTopEl.style.height = '0px';
          gridBottomEl.style.height = '0px';
          gridState.renderedRange = null;
        }
        return;
      }

      const columns = measureColumns();
      if (columns !== gridState.columns) {
        gridState.columns = columns;
        gridState.rowHeight = 0;
      }
      if (!gridState.rowHeight) {
        gridState.rowHeight = measureRowHeight(gridState.episode, gridState.items[0]);
      }

      const { items, episode, rowHeight } = gridState;
      const totalRows = Math.ceil(items.length / columns);
      const scrolledPast = Math.max(0, -gridEl.getBoundingClientRect().top);
      const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
      const firstRow = Math.max(0, Math.floor(scrolledPast / rowHeight) - GRID_ROW_BUFFER);
      const lastRow = Math.min(totalRows - 1, Math.ceil((scrolledPast + viewportHeight) / rowHeight) + GRID_ROW_BUFFER);

      const range = `${firstRow}-${lastRow}`;
      if (gridState.renderedRange === range) return;
      gridState.renderedRange = range;

      gridTopEl.style.height = `${firstRow * rowHeight}px`;
      gridBottomEl.style.height = `${Math.max(0, (totalRows - 1 - lastRow) * rowHeight)}px`;

      // A card that is still wanted stays in the page as it is. Rebuilding every card on each scroll step made
      // iOS Safari redraw every poster from empty (a blink of grey tiles); now only the rows that come into
      // view are built and only the ones that leave are removed.
      if (gridState.cardCache?.episode !== episode) gridState.cardCache = { episode, cards: new WeakMap() };
      const { cards } = gridState.cardCache;
      const startIdx = firstRow * columns;
      const endIdx = Math.min(items.length, (lastRow + 1) * columns);
      const wanted = [];
      for (let i = startIdx; i < endIdx; i++) {
        let card = cards.get(items[i]);
        if (!card) { card = buildCard(items[i], episode); cards.set(items[i], card); }
        wanted.push(card);
      }
      const keep = new Set(wanted);
      for (const child of [...gridItemsEl.children]) if (!keep.has(child)) child.remove();
      let cursor = gridItemsEl.firstElementChild;
      for (const card of wanted) {
        if (card === cursor) cursor = cursor.nextElementSibling;
        else gridItemsEl.insertBefore(card, cursor);
      }
    }

    let gridWindowRafPending = false;
    function scheduleRenderVirtualGridWindow() {
      if (gridWindowRafPending) return;
      gridWindowRafPending = true;
      requestAnimationFrame(() => {
        gridWindowRafPending = false;
        renderVirtualGridWindow();
      });
    }
    window.addEventListener('scroll', scheduleRenderVirtualGridWindow, { passive: true });
    window.addEventListener('resize', scheduleRenderVirtualGridWindow);

    // Close the active plugin view before showing library or search results.
    function closeActiveTab() {
      if (activePluginTab) { activePluginTab.onClose?.(); activePluginTab = null; }
    }

    // Update shared navigation; each plugin renders its own tab content.
    async function openPluginTab(tab) {
      musicHost.stop(); // a plugin's tab (Live TV and the like) is not music
      endSearch();
      viewGuard.begin(); // a library still loading must not draw behind this tab
      onLibraryPage = false;
      currentLibraryId = tab.id;
      rememberView();
      showContinueSection(false);
      showRecentSection(false);
      hideDetailHeader();
      [...librariesEl.children].forEach((btn) => btn.classList.toggle('active', btn.dataset.id === tab.id));
      gridEl.style.display = 'none';
      activePluginTab = tab;
      updateSearchPlaceholder();
      await tab.onOpen();
    }

    // One way a library can be listed: the library's own list of `views` says which, the
    // first being the default. Coming back to the library keeps the view it was left on.
    function chooseView(lib, wanted) {
      const views = lib.views || [];
      return views.find((candidate) => candidate.id === wanted)?.id ?? views[0]?.id ?? null;
    }

    function renderViewSwitch(lib) {
      viewSwitchEl.replaceChildren();
      const views = lib?.views || [];
      viewSwitchEl.hidden = views.length < 2;
      for (const candidate of views) {
        const button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-selected', String(candidate.id === currentView));
        button.textContent = candidate.label;
        button.addEventListener('click', () => {
          if (candidate.id === currentView) return;
          if (searchState) showSearchResults(lib, candidate.id); else openLibrary(lib, candidate.id);
        });
        viewSwitchEl.appendChild(button);
      }
      gridControlsEl.hidden = viewSwitchEl.hidden && libraryActionsEl.hidden;
    }

    // A library's items, a page at a time when it has several ways of being listed (a
    // music library's tracks can number in the tens of thousands). `onPage` gets everything
    // loaded so far and the total. A source that does not page answers with all of it at once.
    const LIBRARY_PAGE = 1000;
    async function fetchLibraryItems(lib, listView, { signal, onPage } = {}) {
      if (lib.type === 'playlists') {
        const playlists = await fetchJson('/api/library/playlists', { signal });
        return { items: playlists, total: playlists.length };
      }
      const paged = !!listView || lib.type === 'music';
      const base = `/api/library/library/${lib.id}?sort=titleSort${listView ? `&view=${encodeURIComponent(listView)}` : ''}`;
      let items = [];
      let total = Infinity;
      while (items.length < total) {
        const page = await fetchJson(paged ? `${base}&start=${items.length}&size=${LIBRARY_PAGE}` : base, { signal });
        const got = page.items || [];
        if (!items.length) total = Number.isFinite(page.total) ? page.total : got.length;
        // A source that ignores paging returned everything; one that returns nothing ends the loop.
        if (!got.length) break;
        // A source that ignores `start` sends the same first page again: that is everything.
        if (items.length && String(got[0].ratingKey) === String(items[0].ratingKey)) break;
        items = items.concat(got);
        if (!paged) break;
        onPage?.(items, total);
      }
      return { items, total: Math.max(total === Infinity ? items.length : total, items.length) };
    }

    async function openLibrary(lib, wantedView = lib.id === currentLibraryId ? currentView : null) {
      if (!keepsMusicPlaying(lib)) musicHost.stop(); // movies and shows are not music
      endSearch();
      const view = viewGuard.begin();
      onLibraryPage = true;
      currentLibraryId = lib.id;
      currentView = chooseView(lib, wantedView);
      rememberView();
      closeActiveTab();
      updateSearchPlaceholder();
      gridEl.style.display = '';
      renderContinueRow();
      recentRow.innerHTML = '';
      recentRow.scrollLeft = 0;
      showRecentSection(false);
      hideDetailHeader();
      if (lib.type !== 'playlists') loadRecentlyAdded(lib.id);
      [...librariesEl.children].forEach((btn) => btn.classList.toggle('active', btn.dataset.id === lib.id));
      showLoading();
      clearGrid();
      renderViewSwitch(lib);
      try {
        currentLibraryItems = [];
        const { items, total } = await fetchLibraryItems(lib, currentView, {
          signal: view.signal,
          // The first page appears at once; the rest arrive behind it.
          onPage: (loaded, all) => {
            if (!view.isCurrent()) return;
            clearLoading();
            currentLibraryItems = loaded;
            renderGrid(loaded, { total: all });
          },
        });
        if (!view.isCurrent()) return; // another tab was chosen while this was loading
        clearLoading();
        currentLibraryItems = items;
        renderGrid(items, { total });
        offerLibraryPlay(lib);
      } catch (err) {
        if (!view.isCurrent() || wasAborted(err)) return;
        showMessage(`Failed to load: ${err.message}`);
      }
    }

    // Above a library of films, its films as listed. A library of videos (home videos, music videos, Other Videos) has
    // Play, from the top, and Shuffle. A library of movies is for choosing from, so for someone who cannot choose it has
    // one button, "Play something", which shuffles them.
    function offerLibraryPlay(lib) {
      const movies = () => gridState.items.filter((item) => item.type === 'movie');
      const chooses = lib.type === 'movie';
      libraryActionsEl.hidden = !((lib.type === 'video' || chooses) && movies().length > 1);
      gridControlsEl.hidden = viewSwitchEl.hidden && libraryActionsEl.hidden;
      const shuffle = document.getElementById('libraryShuffle');
      document.getElementById('libraryPlay').hidden = chooses;
      document.getElementById('libraryPlay').onclick = () => playQueue({ label: lib.title, items: movies(), video: true });
      shuffle.onclick = () => playQueue({ label: lib.title, items: movies(), shuffle: true, video: true });
      shuffle.classList.toggle('primary', chooses);
      shuffle.title = chooses ? 'Plays films from this library, picked at random' : 'Play in random order';
      document.getElementById('libraryShuffleLabel').textContent = chooses ? 'Play something' : 'Shuffle';
    }

    async function openShowSeasons(ratingKey, title) {
      endSearch(); // the results are left behind
      const view = viewGuard.begin();
      onLibraryPage = false;
      rememberView({ show: ratingKey });
      showContinueSection(false);
      showRecentSection(false);
      hideDetailHeader();
      const onBack = () => {
        const lib = libraries.find((l) => l.id === currentLibraryId);
        if (lib) openLibrary(lib);
      };
      showLoading();
      clearGrid();
      try {
        const [seasons, showItem] = await Promise.all([
          fetchJson(`/api/library/show/${ratingKey}/seasons`, { signal: view.signal }),
          fetchJson(`/api/library/item/${ratingKey}`, { signal: view.signal }).catch(() => null),
        ]);
        if (!view.isCurrent()) return;
        clearLoading();
        if (seasons.length === 1 && showItem?.type !== 'artist') {
          // Skip the seasons screen when there's nothing to choose between;
          // back should return straight to the library, not loop through it.
          openSeason(seasons[0], { skippedSeasons: true });
          return;
        }
        if (showItem) {
          // Play on an artist shuffles all its tracks, as Plex does.
          const actions = showItem.type === 'artist' ? {
            playLabel: 'Play',
            playTitle: 'Plays this artist\'s tracks in shuffled order',
            async play() {
              try {
                const tracks = await fetchJson(`/api/library/show/${ratingKey}/episodes`);
                playQueue({ label: showItem.title, items: tracks.filter((item) => item.type === 'track'), shuffle: true });
              } catch (err) { showLoadError(err); }
            },
            // Radio: this artist's tracks mixed with tracks by artists like it, as Plex's artist radio does.
            radioTitle: `Plays ${showItem.title} and artists like it`,
            radio: () => startRadio(showItem, ratingKey),
          } : null;
          renderDetailHeader(showItem, { onBack, actions });
        }
        // (If the show's own details failed to load there is no header, and no back control either: the library
        // tabs along the top are the way out.)
        renderGrid(seasons);
        if (showItem?.type === 'artist') {
          // Extras: whatever goes wrong with them, the albums above stay and nothing is reported.
          optionalSection(() => loadPopularTracks(ratingKey, view, showItem.title));
          optionalSection(() => loadSimilarArtists(ratingKey, view));
        }
      } catch (err) {
        if (!view.isCurrent() || wasAborted(err)) return;
        showMessage(`Failed to load: ${err.message}`);
      }
    }

    // Run an extra part of a screen so that it can never break the rest: its failure, even an error in the
    // code that draws it, is not shown.
    function optionalSection(run) {
      try { Promise.resolve(run()).catch(() => {}); } catch { /* left out */ }
    }

    // Artist radio: some of the artist's own tracks and a few of each of several similar artists', mixed. The
    // queue remembers the artist, so the player can keep adding to it as it runs low.
    async function startRadio(artist, artistKey) {
      const button = document.getElementById('detailRadio');
      button.disabled = true;
      try {
        const items = await gatherRadio({ fetchJson, artistKey });
        if (!items.length) { showMessage('There is nothing to play for this artist'); button.disabled = false; return; }
        playQueue({ label: `${artist.title} Radio`, items, radio: { artistKey } });
      } catch (err) { button.disabled = false; showLoadError(err); }
    }

    // An artist's most played tracks above its albums: the first few, with the rest behind Show More.
    // Tapping one plays them from that one on. Like the rows of similar artists, they are extra: if they
    // cannot be had, nothing is said and the page is as it was.
    const POPULAR_PREVIEW = 5;
    async function loadPopularTracks(artistKey, view, artistTitle) {
      try {
        const tracks = await fetchJson(`/api/library/popular/${artistKey}`, { signal: view.signal });
        if (!view.isCurrent() || !Array.isArray(tracks) || !tracks.length) return;
        // Each row says which album the track is on (the artist is the page's), and plays the list from it.
        const rows = tracks.map((track, index) => ({
          ...track,
          artist: track.album || null,
          onPlay: () => playQueue({ label: `${artistTitle} — Popular`, items: tracks, start: index }),
        }));
        let all = false;
        const draw = () => {
          popularListEl.replaceChildren(...(all ? rows : rows.slice(0, POPULAR_PREVIEW)).map((row) => buildCard(row, true)));
          popularMoreEl.hidden = rows.length <= POPULAR_PREVIEW;
          popularMoreEl.textContent = all ? 'Show Less' : 'Show More';
          popularMoreEl.setAttribute('aria-expanded', String(all));
        };
        popularMoreEl.onclick = () => { all = !all; draw(); };
        draw();
        popularEl.hidden = false;
      } catch { /* no popular tracks: no section, and no message */ }
    }

    // Rows of artists like this one, under its albums. They are a nicety: if Plex has none, or they
    // are slow, the page is as it was.
    async function loadSimilarArtists(artistKey, view) {
      let sections = [];
      try { sections = (await fetchJson(`/api/library/similar/${artistKey}`, { signal: view.signal })).sections || []; } catch { return; }
      if (!view.isCurrent()) return;
      similarEl.replaceChildren();
      const rows = [];
      for (const section of sections) {
        if (!section.items?.length) continue;
        const wrapper = document.createElement('div');
        wrapper.className = 'similarSection';
        const heading = document.createElement('h2');
        heading.textContent = section.title;
        // A carousel: a row that scrolls sideways, with buttons at its ends when there is more to see.
        const carousel = document.createElement('div');
        carousel.className = 'carousel';
        const row = document.createElement('div');
        row.className = 'carouselRow';
        const button = (direction) => {
          const control = document.createElement('button');
          control.type = 'button';
          control.className = `carouselBtn ${direction}`;
          control.hidden = true;
          control.setAttribute('aria-label', direction === 'prev' ? 'Scroll left' : 'Scroll right');
          control.append(iconEl(direction === 'prev' ? 'chevron-left' : 'chevron-right'));
          return control;
        };
        for (const artist of section.items) row.append(buildArtistCard(artist));
        carousel.append(button('prev'), row, button('next'));
        wrapper.append(heading, carousel);
        similarEl.append(wrapper);
        setupCarousel(row);
        rows.push(row);
      }
      // The buttons depend on how wide the rows turned out to be.
      requestAnimationFrame(() => rows.forEach((row) => row.updateCarouselButtons?.()));
    }

    // Sets an artwork image's source, and swaps in the titled tile (see .noArt) when there is none or it fails.
    function setArt(wrap, img, src, label) {
      img.alt = '';
      const showTile = () => {
        wrap.dataset.title = String(label || '').trim();
        wrap.classList.add('noArt');
      };
      if (!src) { showTile(); return; }
      img.addEventListener('error', showTile, { once: true });
      img.src = src;
    }

    // An artist as a card in a carousel: its picture and name, opening its page.
    function buildArtistCard(artist) {
      const card = document.createElement('div');
      card.className = 'recentCard artist';
      const wrap = document.createElement('div');
      wrap.className = 'thumbWrap';
      const img = document.createElement('img');
      img.loading = 'lazy';
      setArt(wrap, img, artist.thumbnail, artist.title);
      wrap.append(img);
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = artist.title;
      card.append(wrap, title);
      card.addEventListener('click', () => handleItemClick(artist));
      return card;
    }

    // A playlist: its tracks, with Play and Shuffle, like an album.
    async function openPlaylist(playlist) {
      endSearch(); // the results are left behind
      const view = viewGuard.begin();
      onLibraryPage = false;
      rememberView(); // a playlist is not an artist or album: reloading returns to the list of them
      showContinueSection(false);
      showRecentSection(false);
      hideDetailHeader();
      const onBack = () => { const lib = libraries.find((l) => l.id === currentLibraryId); if (lib) openLibrary(lib); };
      showLoading();
      clearGrid();
      try {
        const entries = await fetchJson(`/api/library/playlist/${playlist.ratingKey}/items`, { signal: view.signal });
        if (!view.isCurrent()) return;
        // A playlist can hold music, videos or both (see sources.js): Play and Shuffle go through all of it, and the
        // player plays each entry the way it is, a track as music and a video as a film.
        const tracks = entries.filter((item) => item.type === 'track');
        const videos = entries.filter((item) => item.type === 'movie' || item.type === 'episode');
        if (entries.length) clearLoading(); else showMessage('This playlist is empty');
        currentQueueLabel = playlist.title;
        const count = (n, one, many) => (n ? `${n} ${n === 1 ? one : many}` : null);
        renderDetailHeader({ title: playlist.title, thumbnail: playlist.thumbnail, genres: [], summary: '' }, {
          subtitle: [count(tracks.length, 'track', 'tracks'), count(videos.length, 'video', 'videos'), playlist.duration ? `${playlist.duration} min` : null].filter(Boolean).join(' · '),
          onBack,
          actions: entries.length ? {
            play: () => playQueue({ label: playlist.title, items: entries }),
            shuffle: () => playQueue({ label: playlist.title, items: entries, shuffle: true }),
          } : null,
        });
        renderGrid(entries, { episode: !videos.length });
      } catch (err) {
        if (!view.isCurrent() || wasAborted(err)) return;
        showMessage(`Failed to load: ${err.message}`);
      }
    }

    async function openSeason(season, { skippedSeasons = false } = {}) {
      endSearch(); // the results are left behind
      const view = viewGuard.begin();
      onLibraryPage = false;
      rememberView({ show: season.showRatingKey || null, season: season.ratingKey });
      showContinueSection(false);
      showRecentSection(false);
      hideDetailHeader();
      const onBack = skippedSeasons
        ? () => { const lib = libraries.find((l) => l.id === currentLibraryId); if (lib) openLibrary(lib); }
        : () => openShowSeasons(season.showRatingKey, season.showTitle);
      showLoading();
      clearGrid();
      try {
        const [episodes, showItem] = await Promise.all([
          fetchJson(`/api/library/season/${season.ratingKey}/episodes`, { signal: view.signal }),
          season.showRatingKey ? fetchJson(`/api/library/item/${season.showRatingKey}`, { signal: view.signal }).catch(() => null) : null,
        ]);
        if (!view.isCurrent()) return;
        clearLoading();
        // An album (or playlist) of tracks can be played from its start, or shuffled.
        const tracks = episodes.filter((item) => item.type === 'track');
        if (tracks.length) currentQueueLabel = season.title;
        const actions = tracks.length ? {
          play: () => playQueue({ label: season.title, items: tracks }),
          shuffle: () => playQueue({ label: season.title, items: tracks, shuffle: true }),
        } : null;
        if (showItem) {
          renderDetailHeader(showItem, { subtitle: season.title, poster: season.thumbnail, onBack, actions });
        }
        renderGrid(episodes, { episode: true });
      } catch (err) {
        if (!view.isCurrent() || wasAborted(err)) return;
        showMessage(`Failed to load: ${err.message}`);
      }
    }

    // Filter the loaded library items; plugin tabs manage their own content.
    // ---- Search ----
    // A search looks through every library's list, not only the tab that is open. Each tab shows how many results it
    // has, the tab whose results are on screen is lit, and choosing another tab shows the results in that one.
    // `searchState` lives from the first search until the person leaves the results (Back, an empty search, opening
    // something, or another kind of tab); the lists it fetched are kept for the next search made meanwhile.
    let searchState = null; // { query, lists: Map(key -> Promise of the library's items), views: Map(lib id -> view) }
    const searchKey = (lib, view) => `${lib.id}|${view ?? ''}`;
    // Every word typed must be found, in any order, in the title, artist, album, show or year (accents and case ignored).
    const searchMatches = (items, query) => filterItems(items, query);
    function searchListFor(lib, view) {
      const key = searchKey(lib, view);
      if (!searchState.lists.has(key)) {
        const list = fetchLibraryItems(lib, view).then(({ items }) => items);
        list.catch(() => searchState?.lists.delete(key)); // a failed fetch is tried again next time
        searchState.lists.set(key, list);
      }
      return searchState.lists.get(key);
    }
    const searchViewOf = (lib) => searchState.views.get(lib.id) ?? chooseView(lib, lib.id === currentLibraryId ? currentView : null);
    function tabButton(lib) { return [...librariesEl.children].find((btn) => btn.dataset.id === lib.id); }
    function setTabCount(lib, count) {
      const button = tabButton(lib);
      if (!button) return;
      let badge = button.querySelector('.searchCount');
      if (!badge) { badge = document.createElement('span'); badge.className = 'searchCount'; button.append(badge); }
      badge.textContent = count === null ? '…' : count === undefined ? '–' : String(count);
      badge.classList.toggle('none', count === 0 || count === undefined);
      badge.setAttribute('aria-label', count === null ? 'searching' : count === undefined ? 'could not be searched' : `${count} ${count === 1 ? 'result' : 'results'}`);
    }
    function clearTabCounts() { for (const badge of librariesEl.querySelectorAll('.searchCount')) badge.remove(); }
    function endSearch() {
      if (!searchState) return;
      searchState = null;
      clearTabCounts();
      updateSearchPlaceholder();
    }
    function exitSearch() {
      const lib = libraries.find((l) => l.id === currentLibraryId) || libraries[0];
      endSearch();
      if (lib) openLibrary(lib);
    }
    // Count the results of every tab: the one open first, then the rest, one at a time.
    async function countSearchResults(state) {
      const ordered = [...libraries].sort((a, b) => (b.id === currentLibraryId) - (a.id === currentLibraryId));
      for (const lib of ordered) {
        if (searchState !== state) return;
        const view = searchViewOf(lib);
        setTabCount(lib, null);
        try {
          const items = await searchListFor(lib, view);
          if (searchState === state) setTabCount(lib, searchMatches(items, state.query).length);
        } catch { if (searchState === state) setTabCount(lib, undefined); }
      }
    }
    async function showSearchResults(lib, wantedView) {
      if (!searchState) return;
      const state = searchState;
      const view = viewGuard.begin(); // results replace whatever was still loading
      currentLibraryId = lib.id;
      currentView = chooseView(lib, wantedView);
      state.views.set(lib.id, currentView);
      onLibraryPage = false;
      rememberView(); // results are not a place to come back to, so the address is the library's
      showContinueSection(false);
      showRecentSection(false);
      hideDetailHeader();
      closeActiveTab();
      updateSearchPlaceholder();
      gridEl.style.display = '';
      [...librariesEl.children].forEach((btn) => {
        const selected = btn.dataset.id === lib.id;
        btn.classList.toggle('active', selected);
        if (selected) btn.setAttribute('aria-current', 'true'); else btn.removeAttribute('aria-current');
      });
      showLoading();
      clearGrid();
      renderViewSwitch(lib);
      let items;
      try {
        items = await searchListFor(lib, currentView);
      } catch (err) {
        if (!view.isCurrent() || wasAborted(err)) return;
        showMessage(`Failed to load: ${err.message}`);
        return;
      }
      if (!view.isCurrent() || searchState !== state) return;
      const results = searchMatches(items, state.query);
      setTabCount(lib, results.length);
      // The tab counts say how many there are; words are only for when there is nothing here.
      if (results.length) clearLoading();
      else showMessage(`No results for "${state.query}" in ${searchScope() ?? 'this tab'}. The other tabs show how many they have.`);
      renderGrid(results);
    }
    async function runSearch(query) {
      if (activePluginTab?.onSearch) {
        activePluginTab.onSearch(query);
        return;
      }
      const lib = libraries.find((candidate) => candidate.id === currentLibraryId) || libraries[0];
      if (!lib) return;
      // A new search keeps the lists already fetched by one made a moment ago.
      searchState = { query: query.trim(), lists: searchState?.lists ?? new Map(), views: searchState?.views ?? new Map() };
      const state = searchState;
      for (const other of libraries) if (!tabButton(other)?.querySelector('.searchCount')) setTabCount(other, null);
      void countSearchResults(state);
      await showSearchResults(lib, lib.id === currentLibraryId ? currentView : null);
    }

    // The × in the box empties it and, if results are showing, leaves them (back to the library that was open).
    const searchClearEl = document.getElementById('searchClear');
    const syncSearchClear = () => { searchClearEl.hidden = !searchInput.value; };
    function clearSearch() {
      searchInput.value = '';
      syncSearchClear();
      if (searchState) exitSearch();
      searchInput.focus();
    }
    searchInput.addEventListener('input', syncSearchClear);
    searchInput.addEventListener('keydown', (event) => { if (event.key === 'Escape' && (searchInput.value || searchState)) { event.preventDefault(); clearSearch(); } });
    searchClearEl.addEventListener('click', clearSearch);
    searchForm.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const query = searchInput.value.trim();
      if (query) runSearch(query);
      else if (searchState) exitSearch(); // clearing the box and searching again leaves the results
    });

    // Go straight to a show's seasons, or to one season's episodes, as when the page
    // was left. The library tab it belongs to stays highlighted and is where Back goes.
    async function restoreShowView(lib, showKey, seasonKey, wantedView = null) {
      currentLibraryId = lib.id;
      currentView = chooseView(lib, wantedView); // Back from the show returns to the list it was reached from
      [...librariesEl.children].forEach((btn) => btn.classList.toggle('active', btn.dataset.id === lib.id));
      gridEl.style.display = '';
      if (!seasonKey) return openShowSeasons(showKey, 'this show');
      // The show's season list has everything a season needs, and says whether
      // the show has just one season (which skips the season list).
      const view = viewGuard.begin();
      showLoading();
      try {
        const seasons = await fetchJson(`/api/library/show/${showKey}/seasons`, { signal: view.signal });
        if (!view.isCurrent()) return;
        const season = seasons.find((candidate) => String(candidate.ratingKey) === seasonKey);
        if (!season) return openShowSeasons(showKey, 'this show'); // the season is gone; show the show
        return openSeason(season, { skippedSeasons: seasons.length === 1 });
      } catch (err) {
        if (!view.isCurrent() || wasAborted(err)) return;
        return openLibrary(lib); // the show could not be loaded: fall back to its library
      }
    }

    async function main() {
      showLoading();
      // Music comes first.
      libraries = orderLibraries(await fetchJson('/api/library/libraries'));
      // Playlists (of music) are not in a library but on the server; they get a tab of their own, after music.
      try {
        if ((await fetchJson('/api/library/playlists')).length) {
          const after = libraries.findIndex((lib) => lib.type !== 'music');
          libraries.splice(after < 0 ? libraries.length : after, 0, { id: 'playlists', title: 'Playlists', type: 'playlists' });
        }
      } catch { /* this source has none */ }
      clearLoading();
      librariesEl.innerHTML = '';
      for (const lib of libraries) {
        const btn = document.createElement('button');
        btn.textContent = lib.title;
        btn.dataset.id = lib.id;
        // While searching, a tab shows its results; otherwise it opens the library.
        btn.addEventListener('click', () => { if (searchState) showSearchResults(lib, searchViewOf(lib)); else openLibrary(lib); });
        librariesEl.appendChild(btn);
      }
      for (const tab of getTabs()) {
        const btn = document.createElement('button');
        btn.textContent = tab.label;
        btn.dataset.id = tab.id;
        btn.addEventListener('click', () => openPluginTab(tab));
        librariesEl.appendChild(btn);
      }

      const { tab: addressTab, view: addressView, show: requestedShow, season: requestedSeason } = readBrowseView(location.search);
      // The address wins. With no tab in it, go back to the last tab (and that library's view), if it is still there.
      const remembered = tabStorage ? readTabMemory(tabStorage) : { tab: null, views: {} };
      const requestedTab = addressTab ?? startingTab(remembered, [...libraries.map((l) => l.id), ...getTabs().map((tab) => tab.id)]);
      const requestedView = addressTab ? addressView : (remembered.views[requestedTab] ?? null);
      const requestedLibrary = libraries.find((l) => l.id === requestedTab);
      const requestedPluginTab = getTab(requestedTab);
      if (requestedPluginTab) {
        openPluginTab(requestedPluginTab);
      } else if (requestedShow && libraries.length) {
        // A reload (or Back from the player) on a show or season returns there.
        restoreShowView(requestedLibrary || libraries[0], requestedShow, requestedSeason, requestedView);
      } else if (requestedLibrary) {
        openLibrary(requestedLibrary, requestedView);
      } else if (libraries.length) {
        openLibrary(libraries[0]);
      }
      musicHost.restore();
      loadContinueWatching();
    }

    // Wait for plugin registration before building navigation and restoring the tab.
    (async () => {
      try {
        const { scripts } = await fetchJson('/api/plugin/frontend');
        await Promise.all(scripts.map((src) => import(src)));
      } catch (err) {
        console.error('Failed to load plugin frontend assets', err);
      }
      await main();
    })().catch(showLoadError);

    // Refresh Continue Watching when browser history restores a cached page.
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) loadContinueWatching();
    });
  </script>
</body>
</html>
