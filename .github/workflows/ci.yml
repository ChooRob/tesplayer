name: Release checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:release
      - run: npm run vendor:verify:upstream
      - run: npm audit --audit-level=moderate
      - run: npm run release:source
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: docker build --tag freestuffcrazy-player:check .
      - run: docker run --rm --entrypoint sh freestuffcrazy-player:check -c 'test "$(id -u)" != 0 && test -w /app/data && test -r /app/config.json && test -r /app/licenses/MPL-2.0.txt && ffprobe -version && ffmpeg -version'
